<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Webite</title>
    <style>
      :root { --ink: #18201b; --muted: #6b7280; --bg: #ffffff; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.6;
      }
      nav { padding: 24px 32px; font-weight: 700; }
      main { max-width: 680px; margin: 0 auto; padding: 8vh 24px; }
      h1 { font-size: 2.4rem; margin: 0 0 16px; }
      p { color: var(--muted); font-size: 1.1rem; }
      .portrait { float: left; width: 6em; margin: 6px 1em 8px 0; border-radius: 0.5em; transition: transform 0.2s ease; }
      .portrait:hover { transform: rotate(-4deg); }
      .video-embed { clear: both; margin: 32px auto 0; max-width: 720px; }
      @media (max-width: 480px) { .portrait { width: 5em; } }
    </style>
  </head>
  <body>
    <nav><span>My Site</span></nav>
    <main>
      <h1>Hello, world.</h1>
      <img class="portrait" src="assets/uploads/upload-1792484606485-24933720.jpg" alt="Portrait in a white button-down shirt, standing in front of a NASA logo and a wall of equations">
      <p>Have fun with the website! Try the AI assistant, it's really useful. You can double-click the tab name to change it. See the settings gear to add a custom domain (yourname.com).</p>
      <figure class="video-embed"><div style="position:relative;aspect-ratio:16/9;width:100%;max-width:720px;margin:0 auto;border-radius:0.5em;overflow:hidden"><iframe src="https://www.youtube-nocookie.com/embed/jNQXAC9IVRw" title="video" loading="lazy" allowfullscreen="" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div></figure>
      
      
    </main>
  

</body></html>
